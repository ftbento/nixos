general {
    disable_loading_bar = true
    grace = 3
    hide_cursor = true
    no_fade_in = false
    no_fade_out = true
}

background {
    monitor =
    color = rgba(15, 15, 15, 1.0)
    blur_passes = 3
    blur_size = 8
}

label {
    monitor =
    text = cmd[update:1000] date +%H:%M
    color = rgba(255, 255, 255, 1.0)
    font_size = 92
    font_family = JetBrainsMono Nerd Font
    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date "+%a %d %b %Y"
    color = rgba(255, 255, 255, 0.6)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 64
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.7
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.3)
    inner_color = rgba(15, 15, 15, 1.0)
    font_color = rgba(255, 255, 255, 1.0)
    font_family = JetBrainsMono Nerd Font
    check_password = true
    fail_timeout = 2000
    placeholder_text = <span foreground="##666666">Password</span>
    position = 0, -60
    halign = center
    valign = center
}