<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>@@SERVICE_NAME@@ - @@TITLE@@</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2.5rem 1.25rem;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0b1120; color: #e2e8f0; line-height: 1.6;
  }
  main { max-width: 56rem; margin: 0 auto; }
  a { color: #38bdf8; }
  a.back { display: inline-block; margin-bottom: 1.5rem; text-decoration: none; font-size: 0.9rem; }
  a.back:hover { text-decoration: underline; }
  h1 { margin: 0 0 0.25rem; font-size: 1.5rem; }
  p.sub { margin: 0 0 1.5rem; color: #94a3b8; }
  .usage { white-space: normal; }
  pre {
    background: #111827; border: 1px solid #1f2937; border-radius: 0.5rem;
    padding: 1rem; overflow-x: auto; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.85rem; white-space: pre-wrap; word-break: break-word;
  }
  ul.index { list-style: none; padding: 0; }
  ul.index li { background: #111827; border: 1px solid #1f2937; border-radius: 0.5rem; padding: 0.75rem 1rem; margin-bottom: 0.75rem; }
  ul.index a { font-weight: 600; text-decoration: none; }
  ul.index a:hover { text-decoration: underline; }
  ul.index p { margin: 0.25rem 0 0; color: #94a3b8; font-size: 0.85rem; }
  footer { margin-top: 2.5rem; color: #475569; font-size: 0.75rem; }
</style>
</head>
<body>
<main>
  <a class="back" href="@@BACK_HREF@@">&larr; Back to dashboard</a>
  <h1>@@SERVICE_NAME@@</h1>
  <p class="sub">@@DESCRIPTION@@</p>
  <div class="usage">
@@USAGE@@
  </div>
  <footer>@@TITLE@@</footer>
</main>
</body>
</html>
