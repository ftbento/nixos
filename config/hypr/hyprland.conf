# Hyprland configuration
monitor=,preferred,auto,1

$terminal = kitty
$mainMod = SUPER

exec-once = caelestia-shell
exec-once = hyprpaper
exec-once = swaync
exec-once = hyprctl setcursor Bibata-Modern-Classic 24

# Display Configuration
monitor = DP-1, 2560x1440@164.96, 0x0, 1
monitor = HDMI-A-1, 1920x1080@60, 2560x0, 1, transform, 3

input {
    kb_layout = us
    kb_options = 
    sensitivity = 0
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

cursor {
    no_hardware_cursors = true
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 4
        passes = 2
    }
}

# Window rules
# windowrule = nomaximizerequest,.*

# Launcher
bind = $mainMod, D, exec, fuzzel

# Kill active window
bind = $mainMod, Q, killactive

# Terminal
bind = $mainMod, Return, exec, $terminal

# Lock screen
bind = $mainMod, L, exec, hyprlock

# Screenshot
bind = , Print, exec, hyprshot -m output --clipboard-only
bind = $mainMod, Print, exec, hyprshot -m region --clipboard-only
bind = $mainMod SHIFT, Print, exec, hyprshot -m window --clipboard-only

# Focus movement
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspace binds 1-10
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move to workspace 1-10
bind = $mainMod ALT, 1, movetoworkspace, 1
bind = $mainMod ALT, 2, movetoworkspace, 2
bind = $mainMod ALT, 3, movetoworkspace, 3
bind = $mainMod ALT, 4, movetoworkspace, 4
bind = $mainMod ALT, 5, movetoworkspace, 5
bind = $mainMod ALT, 6, movetoworkspace, 6
bind = $mainMod ALT, 7, movetoworkspace, 7
bind = $mainMod ALT, 8, movetoworkspace, 8
bind = $mainMod ALT, 9, movetoworkspace, 9
bind = $mainMod ALT, 0, movetoworkspace, 10

# Move window with arrow keys
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Resize windows
bind = $mainMod CTRL, left, resizeactive, -30 0
bind = $mainMod CTRL, right, resizeactive, 30 0
bind = $mainMod CTRL, up, resizeactive, 0 -30
bind = $mainMod CTRL, down, resizeactive, 0 30
