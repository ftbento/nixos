# Hyprlock configuration

general {
    hide_cursor = true
    no_fade_in = false
    ignore_empty_input = true
    grace = 5
}

background {
    monitor = DP-1
    path = /home/benjidev/Pictures/Wallpapers/default.jpg
    color = rgba(21, 18, 27, 1.0)
    blur_passes = 2
    blur_size = 4
    noise = 0.01
    contrast = 0.8
    brightness = 0.7
    vibrancy = 0.2
    vibrancy_darkness = 0.1
}

background {
    monitor = HDMI-A-1
    path = /home/benjidev/Pictures/Wallpapers/default.jpg
    color = rgba(21, 18, 27, 1.0)
    blur_passes = 2
    blur_size = 4
    noise = 0.01
    contrast = 0.8
    brightness = 0.7
    vibrancy = 0.2
    vibrancy_darkness = 0.1
}

input-field {
    monitor = DP-1
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(96, 216, 255, 0.8)
    inner_color = rgba(21, 18, 27, 0.7)
    font_color = #ffffff
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    check_color = rgba(96, 216, 255, 1.0)
    fail_color = rgba(255, 88, 116, 1.0)
    fail_text = <b>Wrong!</b>
    fail_timeout = 2000
    capslock_color = -1
    position = 0, -50
    halign = center
    valign = center
}

label {
    monitor = DP-1
    text = cmd[update:1000] echo "$(date '+%H:%M')"
    color = #ffffff
    font_size = 48
    font_family = JetBrainsMono Nerd Font
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor = DP-1
    text = cmd[update:1000] echo "$(date '+%A, %d %B %Y')"
    color = rgba(255, 255, 255, 0.7)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor = HDMI-A-1
    text = cmd[update:1000] echo "$(date '+%H:%M')"
    color = #ffffff
    font_size = 48
    font_family = JetBrainsMono Nerd Font
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor = HDMI-A-1
    text = cmd[update:1000] echo "$(date '+%A, %d %B %Y')"
    color = rgba(255, 255, 255, 0.7)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, -80
    halign = center
    valign = center
}
