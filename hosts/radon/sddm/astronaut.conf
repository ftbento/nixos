# Minimal SDDM Astronaut theme config.
# Colors are Catppuccin Mocha to match the Stylix base16Scheme.
# Tweak anything here and run `sudo nixos-rebuild switch` to apply.

[General]
Font="Open Sans"
FontSize="13"
RoundCorners="12"

HeaderText=""
HourFormat="HH:mm"
DateFormat="dddd d MMMM"

#################### Background ####################

Background="Backgrounds/astronaut.png"
DimBackground="0.3"
CropBackground="true"

#################### Colors ####################

HeaderTextColor="#cdd6f4"
DateTextColor="#a6adc8"
TimeTextColor="#cdd6f4"

FormBackgroundColor="#1e1e2e"
BackgroundColor="#1e1e2e"
DimBackgroundColor="#181825"

LoginFieldBackgroundColor="#313244"
PasswordFieldBackgroundColor="#313244"
LoginFieldTextColor="#cdd6f4"
PasswordFieldTextColor="#cdd6f4"
UserIconColor="#a6adc8"
PasswordIconColor="#a6adc8"

PlaceholderTextColor="#6c7086"
WarningColor="#f38ba8"

LoginButtonTextColor="#11111b"
LoginButtonBackgroundColor="#89b4fa"
SystemButtonsIconsColor="#cdd6f4"
SessionButtonTextColor="#cdd6f4"
VirtualKeyboardButtonTextColor="#cdd6f4"

DropdownTextColor="#cdd6f4"
DropdownSelectedBackgroundColor="#313244"
DropdownBackgroundColor="#1e1e2e"

HighlightTextColor="#cdd6f4"
HighlightBackgroundColor="#313244"
HighlightBorderColor="#313244"

HoverUserIconColor="#89b4fa"
HoverPasswordIconColor="#89b4fa"
HoverSystemButtonsIconsColor="#89b4fa"
HoverSessionButtonTextColor="#89b4fa"
HoverVirtualKeyboardButtonTextColor="#89b4fa"

#################### Form ####################

PartialBlur="false"
HaveFormBackground="true"
FormPosition="center"

#################### Interface Behavior ####################

ForceLastUser="true"
PasswordFocus="true"
